#6f685c" letter-spacing="2">ADS</text><text x="16" y="70" font-size="38" font-weight="800" fill="url(#gold)" filter="url(#glow)">0</text><text x="16" y="94" font-size="10" fill="#6f685c">trackers and banners</text></g><g transform="translate(676,0)"><path d="M0.5,0.5 L142,0.5 L153.5,12 L153.5,111.5 L0.5,111.5 Z" fill="url(#g)" stroke="#B8935F" stroke-opacity=".4"/><path d="M1,8 V1 H8" fill="none" stroke="#E8C98A" stroke-width="2"/><path d="M146,111 H153 V104" fill="none" stroke="#E8C98A" stroke-width="2"/><text x="16" y="28" font-size="9.5" fill="#6f685c" letter-spacing="2">PRICE</text><text x="16" y="70" font-size="38" font-weight="800" fill="url(#gold)" filter="url(#glow)">$0</text><text x="16" y="94" font-size="10" fill="#6f685c">free to download</text></g></svg>