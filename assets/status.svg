<svg xmlns="http://www.w3.org/2000/svg" width="830" height="190" viewBox="0 0 830 190" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace"><style>
.rv{opacity:0;animation:rv .5s ease forwards}
@keyframes rv{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.bl{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.pu{animation:pu 3s ease-in-out infinite}@keyframes pu{50%{stroke-opacity:.9}}
.bar{transform-box:fill-box;transform-origin:left;animation:fill 2.2s cubic-bezier(.2,.8,.2,1) forwards}@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}</style><defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0c09"/><stop offset="1" stop-color="#060606"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a6c3f"/><stop offset=".5" stop-color="#E8C98A"/><stop offset="1" stop-color="#B8935F"/></linearGradient>
<filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#B8935F" stroke-opacity=".05"/></pattern>
</defs><rect width="830" height="190" fill="#050505"/><rect width="830" height="190" fill="url(#grid)"/>
<rect x="0.5" y="0.5" width="829" height="189" fill="none" stroke="#B8935F" stroke-opacity=".35"/><path d="M1,16 V1 H16" fill="none" stroke="#E8C98A" stroke-width="2"/><path d="M814,189 H829 V174" fill="none" stroke="#E8C98A" stroke-width="2"/>
<text x="44" y="42" font-size="11" fill="#6f685c" letter-spacing="2">LAUNCH SEQUENCE // ATLOCK v5</text>
<circle cx="634" cy="38" r="4" fill="#3fb97a"/><text x="644" y="42" font-size="11" fill="#B8935F" letter-spacing="1">v4.0 LIVE</text>
<circle cx="722" cy="38" r="4" fill="none" stroke="#e05c4a" stroke-width="1.5"/><text x="732" y="42" font-size="11" fill="#B8935F" letter-spacing="1">v5 LOCKED</text>
<text x="44" y="82" font-size="30" font-weight="800" fill="url(#gold)" filter="url(#glow)">988<tspan fill="#6f685c" font-size="18"> / 1000</tspan><tspan fill="#EDE6D6" font-size="13" font-weight="normal">  downloads</tspan></text>
<text x="786" y="82" font-size="14" fill="#E8C98A" text-anchor="end" font-weight="bold">12 to go</text>
<rect x="44" y="94" width="742" height="14" rx="3" fill="#111" stroke="#B8935F" stroke-opacity=".35"/>
<rect class="bar" x="44" y="94" width="733.1" height="14" rx="3" fill="url(#gold)"/>
<line x1="44.0" y1="112" x2="44.0" y2="120" stroke="#B8935F" stroke-opacity=".4"/><line x1="118.2" y1="112" x2="118.2" y2="120" stroke="#B8935F" stroke-opacity=".4"/><line x1="192.4" y1="112" x2="192.4" y2="120" stroke="#B8935F" stroke-opacity=".4"/><line x1="266.6" y1="112" x2="266.6" y2="120" stroke="#B8935F" stroke-opacity=".4"/><line x1="340.8" y1="112" x2="340.8" y2="120" stroke="#B8935F" stroke-opacity=".4"/><line x1="415.0" y1="112" x2="415.0" y2="120" stroke="#B8935F" stroke-opacity=".4"/><line x1="489.2" y1="112" x2="489.2" y2="120" stroke="#B8935F" stroke-opacity=".4"/><line x1="563.4" y1="112" x2="563.4" y2="120" stroke="#B8935F" stroke-opacity=".4"/><line x1="637.6" y1="112" x2="637.6" y2="120" stroke="#B8935F" stroke-opacity=".4"/><line x1="711.8" y1="112" x2="711.8" y2="120" stroke="#B8935F" stroke-opacity=".4"/><line x1="786.0" y1="112" x2="786.0" y2="120" stroke="#B8935F" stroke-opacity=".4"/>
<text x="44" y="146" font-size="12.5" fill="#6f685c"><tspan fill="#3fb97a">$</tspan> ./release --when downloads&gt;=1000</text>
<text x="44" y="168" font-size="12.5" fill="#EDE6D6">v5 ships the moment the bar fills. <tspan fill="#E8C98A">Be one of the 12.</tspan> <tspan class="bl" fill="#E8C98A">█</tspan></text></svg>