<svg xmlns="http://www.w3.org/2000/svg" width="830" height="110" viewBox="0 0 830 110" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace"><style>
.rv{opacity:0;animation:rv .5s ease forwards}
@keyframes rv{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.bl{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.pu{animation:pu 3s ease-in-out infinite}@keyframes pu{50%{stroke-opacity:.9}}
</style><defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0c09"/><stop offset="1" stop-color="#060606"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a6c3f"/><stop offset=".5" stop-color="#E8C98A"/><stop offset="1" stop-color="#B8935F"/></linearGradient>
<filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#B8935F" stroke-opacity=".05"/></pattern>
</defs><rect width="830" height="110" fill="#050505"/><rect width="830" height="110" fill="url(#grid)"/>
<rect x="0.5" y="0.5" width="829" height="109" fill="none" stroke="#B8935F" stroke-opacity=".35"/><path d="M1,14 V1 H14" fill="none" stroke="#E8C98A" stroke-width="2"/><path d="M816,109 H829 V96" fill="none" stroke="#E8C98A" stroke-width="2"/>
<text x="44" y="42" font-size="13" fill="#6f685c"><tspan fill="#3fb97a">$</tspan> echo $PHILOSOPHY</text>
<text x="44" y="78" font-size="22" font-weight="800" fill="url(#gold)" filter="url(#glow)">your machine. your data. your control.<tspan class="bl" fill="#E8C98A"> █</tspan></text></svg>