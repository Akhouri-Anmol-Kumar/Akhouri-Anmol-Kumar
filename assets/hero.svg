<text class="gl1" x="44" y="148" font-size="54" font-weight="800" fill="#8a6c3f" letter-spacing="3" opacity=".85">AKHOURI ANMOL KUMAR</text>
<text class="gl2" x="44" y="148" font-size="54" font-weight="800" fill="#ffffff" letter-spacing="3" opacity=".35">AKHOURI ANMOL KUMAR</text>
<text x="44" y="148" font-size="54" font-weight="800" fill="url(#gold)" letter-spacing="3">AKHOURI ANMOL KUMAR</text></g>
<text x="44" y="196" font-size="14" fill="#EDE6D6" font-weight="normal" class="rv" style="animation-delay:0.9s"><tspan fill="#B8935F">&gt;&gt;</tspan> software engineer · python / html / css · ranchi, india</text>
<text x="44" y="220" font-size="14" fill="#EDE6D6" font-weight="normal" class="rv" style="animation-delay:1.3s"><tspan fill="#B8935F">&gt;&gt;</tspan> I build free desktop tools that never phone home</text>
